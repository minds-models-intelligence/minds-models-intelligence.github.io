# ─────────────────────────────────────────────────────────────
# WHO IT IS FOR and WHAT COMES OUT OF IT.
# ─────────────────────────────────────────────────────────────

audience:
  eyebrow: Who it is for
  heading: Across fields and sectors
  text: >
    Faculty, postdoctoral fellows, technical staff, and graduate students from
    across Harvard, in neuroscience, applied mathematics, and AI, joined by
    guests from industry who bring the problems they are working on.
  registrationHeading: Registration will ask for
  registration:
    - Your pillar or pillars
    - One question you want to discuss
    - Whether you want to present a poster or join the sprint

deliverables:
  eyebrow: Outcomes
  heading: What we leave with
  lede: Each activity is designed to produce something that lasts beyond the two days.
  items:
    - name: Seed collaborations
      text: >
        Cross-pillar teams formed on Day 2, each with a one-page pilot pitch
        and encouraged to apply for internal seed funding.
    - name: Shared resources
      text: >
        An open repository with the sprint prototypes, starter code and
        notebooks, primer materials, curated datasets, a digital poster
        gallery, and a living “open problems” list.
    - name: White paper
      text: >
        A co-authored perspective on the open questions for each arrow of the
        cycle, drafted by volunteer writing leads after the event.
    - name: Ongoing community
      text: >
        A monthly trainee-led seminar or hack night, a shared communication
        channel, and a plan to make the unconference a recurring event.
